<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Assistant:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    .screen {
      width: 390px;
      min-height: 700px;
      background: oklch(0.985 0.004 230);
      font-family: 'Assistant', 'Segoe UI', Arial, sans-serif;
      direction: rtl;
      color: oklch(0.22 0.02 240);
      padding: 22px 18px 40px;
      display: flex; flex-direction: column;
    }
    .header { position: relative; padding: 6px 0 4px; text-align: center; }
    .menu-btn, .back-btn {
      position: absolute; top: 0;
      width: 38px; height: 38px; border-radius: 10px;
      border: 1px solid oklch(0.88 0.01 230); background: oklch(1 0 0);
      display: flex; align-items: center; justify-content: center;
    }
    .menu-btn { right: 0; }
    .back-btn { left: 0; }
    .logo-lockup { display: flex; align-items: center; justify-content: center; gap: 5px; direction: ltr; }
    .logo { font-family: 'Fredoka', 'Assistant', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 0.2px; }
    .logo .wab { color: oklch(0.3 0.03 235); }
    .logo .bit { color: oklch(0.52 0.11 225); }

    .center { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 4px; }
    .chat-icon-wrap {
      width: 68px; height: 68px; border-radius: 20px; margin: 0 auto 22px;
      background: oklch(0.95 0.02 225); display: flex; align-items: center; justify-content: center;
    }
    .headline { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 8px; }
    .subtext { font-size: 13.5px; color: oklch(0.5 0.02 235); text-align: center; margin-bottom: 26px; }

    .field { margin-bottom: 8px; }
    .field-label { font-size: 12.5px; font-weight: 700; color: oklch(0.4 0.02 235); margin-bottom: 6px; display: block; }
    .field input {
      width: 100%; border: 1px solid oklch(0.88 0.01 230); border-radius: 10px; padding: 13px 14px;
      font-family: inherit; font-size: 15px; color: oklch(0.22 0.02 240); text-align: right;
      background: oklch(1 0 0);
    }
    .field input::placeholder { color: oklch(0.65 0.01 230); }
    .field-hint { font-size: 11.5px; color: oklch(0.6 0.01 230); margin-bottom: 24px; }

    .btn-primary {
      width: 100%; border: none; background: oklch(0.52 0.11 225); color: white;
      font-weight: 700; font-size: 16px; border-radius: 999px; padding: 15px; margin-bottom: 16px;
      box-shadow: 0 8px 18px oklch(0.45 0.11 225 / 0.3);
    }

    .register-note {
      text-align: center; font-size: 12.5px; color: oklch(0.55 0.02 235); line-height: 1.6;
    }
    .register-note a { color: oklch(0.52 0.11 225); font-weight: 700; text-decoration: underline; }
  </style>
</helmet>
<div class="screen">
  <div class="header">
    <div class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.28 0.03 235)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
    </div>
    <div class="logo-lockup">
      <svg width="19" height="19" viewBox="0 0 24 24">
        <ellipse cx="9" cy="7" rx="3" ry="7.5" fill="oklch(0.62 0.16 40)" transform="rotate(-18 9 7)"/>
        <ellipse cx="15" cy="7" rx="3" ry="7.5" fill="oklch(0.52 0.11 225)" transform="rotate(18 15 7)"/>
      </svg>
      <div class="logo"><span class="wab">WAB</span><span class="bit">BIT</span></div>
    </div>
    <button class="menu-btn" aria-label="תפריט">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.28 0.03 235)" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
  </div>

  <div class="center">
    <div class="chat-icon-wrap">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="oklch(0.52 0.11 225)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </div>
    <div class="headline">רגע לפני שנכנסים...</div>
    <div class="subtext">איך נקרא לכם בחדר?</div>

    <div class="field">
      <label class="field-label">כינוי</label>
      <input type="text" placeholder="למשל: אמא של יונתן">
    </div>
    <div class="field-hint">יוצג לכל מי שנמצא בחדר</div>

    <button class="btn-primary">כניסה לצ'אט 💬</button>

    <div class="register-note">
      נרשמים פעם אחת - והכינוי נשמר לכם אוטומטית בכל כניסה<br>
      <a>הרשמה מהירה</a>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
