<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Assistant:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    .screen {
      position: relative;
      width: 390px;
      min-height: 900px;
      background: oklch(0.985 0.004 230);
      font-family: 'Assistant', 'Segoe UI', Arial, sans-serif;
      direction: rtl;
      color: oklch(0.22 0.02 240);
      overflow: hidden;
    }
    .blob { position: absolute; border-radius: 50%; filter: blur(38px); }
    .blob-1 { top: -70px; left: -90px; width: 260px; height: 260px; background: oklch(0.82 0.08 225); opacity: 0.5; }
    .blob-2 { top: 90px; right: -80px; width: 210px; height: 210px; background: oklch(0.84 0.13 40); opacity: 0.28; }
    .bunny { position: absolute; top: -30px; right: -40px; opacity: 0.07; }
    .confetti { position: absolute; opacity: 0.6; }
    .content { position: relative; z-index: 1; padding: 22px 18px 40px; }
    .header { position: relative; padding: 6px 0 4px; display: flex; align-items: center; justify-content: center; }
    .menu-btn {
      position: absolute; top: 0; right: 0;
      width: 38px; height: 38px; border-radius: 12px;
      border: 1px solid oklch(0.88 0.01 230); background: oklch(1 0 0 / 0.9);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-lockup { display: flex; align-items: center; gap: 6px; direction: ltr; }
    .logo {
      font-family: 'Fredoka', 'Assistant', sans-serif;
      font-size: 24px; font-weight: 700; letter-spacing: 0.3px;
    }
    .logo .wab { color: oklch(0.3 0.03 235); }
    .logo .bit { color: oklch(0.52 0.11 225); }
    .headline { margin: 14px 0 20px; text-align: center; font-size: 19px; font-weight: 800; line-height: 1.4; color: oklch(0.24 0.03 235); padding: 0 12px; }
    .headline .accent { color: oklch(0.62 0.16 40); }

    .pills-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 18px; margin: 0 -2px; }
    .pill-chip {
      display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0;
      border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 700;
      border: 1.5px solid transparent;
    }
    .pill-chip.c1 { background: oklch(0.94 0.05 210); color: oklch(0.4 0.1 220); }
    .pill-chip.c2 { background: oklch(0.93 0.06 150); color: oklch(0.38 0.11 150); }
    .pill-chip.c3 { background: oklch(0.92 0.08 40); color: oklch(0.45 0.13 35); }

    .filters-card {
      background: oklch(1 0 0);
      border: 1px solid oklch(0.92 0.01 230);
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: 0 4px 16px oklch(0.3 0.02 230 / 0.07);
    }
    .filter-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px dashed oklch(0.9 0.01 230);
    }
    .filter-row.last { border-bottom: none; }
    .filter-label { display: flex; align-items: center; gap: 11px; font-size: 14px; color: oklch(0.4 0.02 235); font-weight: 600; }
    .icon-chip { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icon-chip.purple { background: oklch(0.93 0.06 300); }
    .icon-chip.yellow { background: oklch(0.93 0.09 90); }
    .icon-chip.green { background: oklch(0.92 0.07 150); }
    .icon-chip.blue { background: oklch(0.92 0.05 225); }
    .filter-value {
      display: flex; align-items: center; gap: 6px;
      background: oklch(0.96 0.005 230); border-radius: 999px;
      padding: 7px 13px; font-size: 14px; font-weight: 700; color: oklch(0.22 0.02 240);
    }
    .btn-spontaneous {
      width: 100%; border: 2px solid oklch(0.62 0.16 40);
      background: oklch(0.99 0.03 60);
      color: oklch(0.5 0.15 40); font-weight: 700; font-size: 15.5px;
      border-radius: 999px; padding: 13px; margin-bottom: 10px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-search {
      width: 100%; border: none;
      background: oklch(0.52 0.11 225);
      color: oklch(0.99 0 0); font-weight: 700; font-size: 16.5px;
      border-radius: 999px; padding: 15px; margin-bottom: 20px;
      box-shadow: 0 8px 18px oklch(0.45 0.11 225 / 0.3);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .free-search {
      display: flex; align-items: center; gap: 10px;
      background: oklch(1 0 0); border: 1px solid oklch(0.88 0.01 230);
      border-radius: 999px; padding: 12px 16px;
    }
    .free-search input {
      border: none; outline: none; background: transparent; flex: 1;
      font-family: inherit; font-size: 14px; color: oklch(0.22 0.02 240); text-align: right;
    }
    .free-search input::placeholder { color: oklch(0.6 0.01 230); }
  </style>
</helmet>
<div class="screen">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <svg class="bunny" width="260" height="260" viewBox="0 0 200 200">
    <ellipse cx="72" cy="46" rx="16" ry="48" fill="oklch(0.4 0.05 235)" transform="rotate(-16 72 46)"/>
    <ellipse cx="128" cy="46" rx="16" ry="48" fill="oklch(0.4 0.05 235)" transform="rotate(16 128 46)"/>
    <circle cx="100" cy="128" r="58" fill="oklch(0.4 0.05 235)"/>
  </svg>
  <svg class="confetti" style="top:16px; left:64px;" width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="oklch(0.68 0.14 40)"/></svg>
  <svg class="confetti" style="top:78px; left:24px;" width="18" height="18" viewBox="0 0 24 24"><rect x="4" y="4" width="14" height="14" rx="3" fill="none" stroke="oklch(0.52 0.11 225)" stroke-width="2" transform="rotate(18 12 12)"/></svg>
  <svg class="confetti" style="top:14px; right:120px;" width="12" height="12" viewBox="0 0 24 24"><path d="M12 2l2.5 7.5H22l-6 4.5 2.3 7.5L12 17l-6.3 4.5L8 14l-6-4.5h7.5z" fill="oklch(0.75 0.13 90)"/></svg>
  <svg class="confetti" style="top:150px; left:40px;" width="10" height="10" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="oklch(0.52 0.11 225)"/></svg>
  <svg class="confetti" style="top:210px; right:34px;" width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="oklch(0.68 0.14 40)" stroke-width="2.4"/></svg>

  <div class="content">
    <div class="header">
      <button class="menu-btn" aria-label="תפריט">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.28 0.03 235)" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <div class="logo-lockup">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <ellipse cx="9" cy="7" rx="3" ry="7.5" fill="oklch(0.62 0.16 40)" transform="rotate(-18 9 7)"/>
          <ellipse cx="15" cy="7" rx="3" ry="7.5" fill="oklch(0.52 0.11 225)" transform="rotate(18 15 7)"/>
        </svg>
        <div class="logo"><span class="wab">WAB</span><span class="bit">BIT</span></div>
      </div>
    </div>
    <p class="headline">לאן הילדים מוציאים <span class="accent">אנרגיה</span> הפעם?</p>

    <div class="pills-row">
      <div class="pill-chip c1">🧊 ממוזג ובקירור</div>
      <div class="pill-chip c2">🌳 פארקים בחינם</div>
      <div class="pill-chip c3">🦕 דינוזאורים ומדע</div>
    </div>

    <div class="filters-card">
      <div class="filter-row">
        <div class="filter-label">
          <div class="icon-chip purple">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.14 300)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><circle cx="17.5" cy="17.5" r="3.5"/></svg>
          </div>
          <span>מה בא לנו?</span>
        </div>
        <div class="filter-value">
          <span>הכל</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.02 235)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-label">
          <div class="icon-chip yellow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.55 0.13 80)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
          </div>
          <span>מתי?</span>
        </div>
        <div class="filter-value">
          <span>עכשיו</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.02 235)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-label">
          <div class="icon-chip green">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.13 150)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="1.8" fill="oklch(0.5 0.13 150)" stroke="none"/><line x1="4" y1="14" x2="20" y2="14"/><circle cx="16" cy="14" r="1.8" fill="oklch(0.5 0.13 150)" stroke="none"/><line x1="4" y1="21" x2="20" y2="21"/><circle cx="12" cy="21" r="1.8" fill="oklch(0.5 0.13 150)" stroke="none"/></svg>
          </div>
          <span>גילאים</span>
        </div>
        <div class="filter-value">
          <span>הכל</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.02 235)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="filter-row last">
        <div class="filter-label">
          <div class="icon-chip blue">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.11 225)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
          </div>
          <span>איפה</span>
        </div>
        <div class="filter-value">
          <span>באזור שלי</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.02 235)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
    </div>

    <button class="btn-spontaneous">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.15 40)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="oklch(0.5 0.15 40)" stroke="none"/><circle cx="15.5" cy="8.5" r="1.2" fill="oklch(0.5 0.15 40)" stroke="none"/><circle cx="8.5" cy="15.5" r="1.2" fill="oklch(0.5 0.15 40)" stroke="none"/><circle cx="15.5" cy="15.5" r="1.2" fill="oklch(0.5 0.15 40)" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="oklch(0.5 0.15 40)" stroke="none"/></svg>
      זורמים עכשיו
    </button>

    <button class="btn-search">
      <span>יאללה, יוצאים לדרך!</span>
      <span>🚀</span>
    </button>

    <div class="free-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.6 0.01 230)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
      <input type="text" placeholder="חפשו פעילות, אירוע או מקום...">
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
