<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Assistant:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    .screen {
      width: 390px;
      min-height: 800px;
      background: oklch(0.985 0.004 230);
      font-family: 'Assistant', 'Segoe UI', Arial, sans-serif;
      direction: rtl;
      color: oklch(0.22 0.02 240);
      padding: 22px 18px 20px;
      display: flex; flex-direction: column;
    }
    .header { position: relative; padding: 6px 0 4px; text-align: center; }
    .menu-btn, .back-btn {
      position: absolute; top: 0;
      width: 38px; height: 38px; border-radius: 10px;
      border: 1px solid oklch(0.88 0.01 230); background: oklch(1 0 0);
      display: flex; align-items: center; justify-content: center;
    }
    .menu-btn { right: 0; }
    .back-btn { left: 0; }
    .logo-lockup { display: flex; align-items: center; justify-content: center; gap: 5px; direction: ltr; }
    .logo { font-family: 'Fredoka', 'Assistant', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 0.2px; }
    .logo .wab { color: oklch(0.3 0.03 235); }
    .logo .bit { color: oklch(0.52 0.11 225); }

    .room-info-row { display: flex; align-items: center; gap: 10px; margin: 20px 0 12px; }
    .room-avatar {
      width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
      background: oklch(0.52 0.11 225); display: flex; align-items: center; justify-content: center;
    }
    .room-info-mid { flex: 1; min-width: 0; }
    .room-info-name { font-size: 15px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .room-info-sub { font-size: 11.5px; color: oklch(0.5 0.02 235); }
    .room-menu-btn {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      border: 1px solid oklch(0.9 0.01 230); background: oklch(1 0 0);
      display: flex; align-items: center; justify-content: center;
    }

    .close-banner {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 11px; color: oklch(0.55 0.02 235); background: oklch(0.97 0.01 90);
      border-radius: 10px; padding: 8px; margin-bottom: 16px;
    }

    .date-divider { text-align: center; font-size: 11px; color: oklch(0.6 0.01 230); font-weight: 700; margin-bottom: 14px; }

    .messages { flex: 1; }
    .msg-row { display: flex; flex-direction: column; margin-bottom: 14px; }
    .msg-row.own { align-items: flex-start; }
    .msg-row.other { align-items: flex-end; }
    .msg-sender { font-size: 11.5px; font-weight: 700; margin-bottom: 3px; display: flex; align-items: center; gap: 5px; }
    .guest-badge { font-size: 9px; font-weight: 700; color: oklch(0.55 0.02 235); background: oklch(0.93 0.01 230); border-radius: 5px; padding: 1px 5px; }
    .bubble-wrap { display: flex; align-items: flex-end; gap: 6px; max-width: 78%; }
    .bubble { padding: 9px 13px; border-radius: 16px; font-size: 13.5px; line-height: 1.45; }
    .msg-row.own .bubble { background: oklch(0.52 0.11 225); color: white; border-bottom-left-radius: 4px; }
    .msg-row.other .bubble { background: oklch(1 0 0); border: 1px solid oklch(0.9 0.01 230); color: oklch(0.22 0.02 240); border-bottom-right-radius: 4px; }
    .msg-time { font-size: 10px; color: oklch(0.6 0.01 230); margin-top: 3px; }
    .msg-action-btn {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      background: oklch(1 0 0); border: 1px solid oklch(0.9 0.01 230);
      display: flex; align-items: center; justify-content: center;
    }

    .input-bar {
      display: flex; align-items: center; gap: 8px; margin-top: 16px;
      background: oklch(1 0 0); border: 1px solid oklch(0.88 0.01 230); border-radius: 999px; padding: 8px 8px 8px 8px;
    }
    .input-bar input {
      flex: 1; border: none; outline: none; background: transparent;
      font-family: inherit; font-size: 13.5px; text-align: right; color: oklch(0.22 0.02 240); padding: 0 8px;
    }
    .send-btn {
      width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; border: none;
      background: oklch(0.52 0.11 225); display: flex; align-items: center; justify-content: center;
    }
  </style>
</helmet>
<div class="screen">
  <div class="header">
    <div class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.28 0.03 235)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
    </div>
    <div class="logo-lockup">
      <svg width="19" height="19" viewBox="0 0 24 24">
        <ellipse cx="9" cy="7" rx="3" ry="7.5" fill="oklch(0.62 0.16 40)" transform="rotate(-18 9 7)"/>
        <ellipse cx="15" cy="7" rx="3" ry="7.5" fill="oklch(0.52 0.11 225)" transform="rotate(18 15 7)"/>
      </svg>
      <div class="logo"><span class="wab">WAB</span><span class="bit">BIT</span></div>
    </div>
    <button class="menu-btn" aria-label="תפריט">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.28 0.03 235)" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
  </div>

  <div class="room-info-row">
    <div class="room-avatar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </div>
    <div class="room-info-mid">
      <div class="room-info-name">הצ'אט הראשי</div>
      <div class="room-info-sub">🟢 14 מחוברים עכשיו</div>
    </div>
    <button class="room-menu-btn" aria-label="פעולות חדר">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="oklch(0.4 0.02 235)"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </div>

  <div class="close-banner">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="oklch(0.55 0.02 235)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
    <span>חדר תמיד פתוח - אין סגירה אוטומטית</span>
  </div>

  <div class="messages">
    <div class="date-divider">היום</div>

    <div class="msg-row other">
      <div class="msg-sender" style="color: oklch(0.55 0.13 80);">דני <span class="guest-badge">אורח</span></div>
      <div class="bubble-wrap">
        <button class="msg-action-btn" aria-label="דיווח">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.02 235)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        </button>
        <div class="bubble">היי לכולם, מישהו יודע אם השילוב פתוח היום?</div>
      </div>
      <div class="msg-time">09:02</div>
    </div>

    <div class="msg-row other">
      <div class="msg-sender" style="color: oklch(0.5 0.14 300);">מיכל</div>
      <div class="bubble-wrap">
        <button class="msg-action-btn" aria-label="דיווח">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.02 235)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        </button>
        <div class="bubble">כן, בדקתי אתמול - פתוח כרגיל</div>
      </div>
      <div class="msg-time">09:14</div>
    </div>

    <div class="msg-row own">
      <div class="bubble-wrap">
        <div class="bubble">מעולה, תודה על העדכון!</div>
        <button class="msg-action-btn" aria-label="מחיקה">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.02 235)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
      <div class="msg-time">09:16</div>
    </div>

    <div class="msg-row other">
      <div class="msg-sender" style="color: oklch(0.5 0.13 150);">רותם <span class="guest-badge">אורח</span></div>
      <div class="bubble-wrap">
        <button class="msg-action-btn" aria-label="דיווח">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.02 235)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        </button>
        <div class="bubble">גם אנחנו בדרך 🚗</div>
      </div>
      <div class="msg-time">09:20</div>
    </div>

    <div class="msg-row other">
      <div class="msg-sender" style="color: oklch(0.5 0.14 300);">מיכל</div>
      <div class="bubble-wrap">
        <button class="msg-action-btn" aria-label="דיווח">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.02 235)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        </button>
        <div class="bubble">מישהו מכיר פעילות טובה לגשם?</div>
      </div>
      <div class="msg-time">10:42</div>
    </div>
  </div>

  <div class="input-bar">
    <input type="text" placeholder="כתבו הודעה...">
    <button class="send-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
