<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Assistant:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    .screen {
      width: 390px;
      min-height: 760px;
      background: oklch(0.985 0.004 230);
      font-family: 'Assistant', 'Segoe UI', Arial, sans-serif;
      direction: rtl;
      color: oklch(0.22 0.02 240);
      padding: 22px 18px 40px;
    }
    .header { position: relative; padding: 6px 0 4px; text-align: center; }
    .menu-btn, .back-btn {
      position: absolute; top: 0;
      width: 38px; height: 38px; border-radius: 10px;
      border: 1px solid oklch(0.88 0.01 230); background: oklch(1 0 0);
      display: flex; align-items: center; justify-content: center;
    }
    .menu-btn { right: 0; }
    .back-btn { left: 0; }
    .logo-lockup { display: flex; align-items: center; justify-content: center; gap: 5px; direction: ltr; }
    .logo { font-family: 'Fredoka', 'Assistant', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 0.2px; }
    .logo .wab { color: oklch(0.3 0.03 235); }
    .logo .bit { color: oklch(0.52 0.11 225); }

    .headline { font-size: 20px; font-weight: 800; margin: 26px 0 6px; }
    .subtext { font-size: 13.5px; color: oklch(0.5 0.02 235); margin-bottom: 22px; }

    .field { margin-bottom: 8px; }
    .field-label { font-size: 12.5px; font-weight: 700; color: oklch(0.4 0.02 235); margin-bottom: 6px; display: block; }
    .field input {
      width: 100%; border: 1px solid oklch(0.88 0.01 230); border-radius: 10px; padding: 12px 14px;
      font-family: inherit; font-size: 14px; color: oklch(0.22 0.02 240); text-align: right;
      background: oklch(1 0 0);
    }
    .field input::placeholder { color: oklch(0.65 0.01 230); }
    .field-hint { font-size: 11.5px; color: oklch(0.6 0.01 230); margin-bottom: 26px; }

    .guideline-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .guideline-icon { width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .guideline-icon.blue { background: oklch(0.92 0.05 225); }
    .guideline-icon.green { background: oklch(0.92 0.07 150); }
    .guideline-icon.yellow { background: oklch(0.93 0.09 90); }
    .guideline-text { font-size: 13px; line-height: 1.5; color: oklch(0.4 0.02 235); padding-top: 5px; }
    .guideline-text b { color: oklch(0.22 0.02 240); }

    .btn-primary {
      width: 100%; border: none; background: oklch(0.52 0.11 225); color: white;
      font-weight: 700; font-size: 16px; border-radius: 999px; padding: 15px; margin-top: 20px;
      box-shadow: 0 8px 18px oklch(0.45 0.11 225 / 0.3);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
  </style>
</helmet>
<div class="screen">
  <div class="header">
    <div class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.28 0.03 235)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
    </div>
    <div class="logo-lockup">
      <svg width="19" height="19" viewBox="0 0 24 24">
        <ellipse cx="9" cy="7" rx="3" ry="7.5" fill="oklch(0.62 0.16 40)" transform="rotate(-18 9 7)"/>
        <ellipse cx="15" cy="7" rx="3" ry="7.5" fill="oklch(0.52 0.11 225)" transform="rotate(18 15 7)"/>
      </svg>
      <div class="logo"><span class="wab">WAB</span><span class="bit">BIT</span></div>
    </div>
    <button class="menu-btn" aria-label="תפריט">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.28 0.03 235)" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
  </div>

  <div class="headline">פתחו חדר חדש 💬</div>
  <div class="subtext">בחרו נושא לשיחה, ותהיו מנהלי החדר שלכם</div>

  <div class="field">
    <label class="field-label">שם החדר</label>
    <input type="text" placeholder="לדוגמה: הורים לפעוטות - השרון">
  </div>
  <div class="field-hint">לפחות 3 תווים</div>

  <div class="guideline-row">
    <div class="guideline-icon blue">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.11 225)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>
    </div>
    <div class="guideline-text"><b>תהיו מנהלי החדר</b> - תוכלו למחוק הודעות ולסגור אותו בכל רגע</div>
  </div>
  <div class="guideline-row">
    <div class="guideline-icon green">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.13 150)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15.5 13.2c2.7.4 4.5 2.3 4.5 5.3"/></svg>
    </div>
    <div class="guideline-text"><b>כולם יכולים להצטרף</b> - גם מי שלא רשום יוכל להיכנס ולכתוב</div>
  </div>
  <div class="guideline-row">
    <div class="guideline-icon yellow">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.55 0.13 80)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
    </div>
    <div class="guideline-text"><b>סגירה אוטומטית</b> - אם לא תישלח הודעה במשך 24 שעות, החדר ייסגר לבד</div>
  </div>

  <button class="btn-primary">
    <span>צרו את החדר</span>
    <span>🐰</span>
  </button>
</div>
</x-dc>
</body>
</html>
